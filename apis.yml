aid: lena-health
name: Lena Health
description: 'Lena Health is a Houston, Texas healthcare technology company founded
  in the Texas Medical Center that combines AI agents with human care navigators to
  deliver care coordination at scale. Its LenaConnect platform handles routine patient
  outreach calls, appointment scheduling and coordination, payer and provider hold
  times, automatic call documentation, EHR integration, and resource and referral
  management, so human navigators can focus on building trust with patients. Lena
  offers fully managed care navigation services covering Chronic Care Management (CCM),
  Transitional Care Management (TCM), rising-risk care management, and annual wellness
  visits, and works with health plans, accountable care organizations (ACOs), health
  systems, provider groups, care management providers, and community organizations.
  The company reports retrospective matched-cohort results of 29% fewer unplanned
  readmissions, 42% fewer ED visits, and $3,116 saved per patient within 180 days.
  Lena Health is HIPAA compliant and SOC 2 Type II certified, and publishes a trust
  center. Lena Health is a Techstars portfolio company. No public API, developer portal,
  or machine-readable API specification was found during enrichment; the platform is
  delivered as a managed service with EHR integration handled through engagements.'
